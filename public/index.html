<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrossBot AI - Offline Demo</title>
<style>
:root {
  --bg-dark: #0f1117;
  --panel-bg: #161824;
  --card-bg: #1c1f30;
  --input-bg: #22253a;
  --border: #2a2d42;
  --primary: #6366f1;
  --primary-hover: #818cf8;
  --accent: #a855f7;
  --success: #22c55e;
  --warning: #f59e0b;
  --danger: #ef4444;
  --text-primary: #f1f5f9;
  --text-secondary: #a0a4b8;
  --text-muted: #6b7084;
  --user-bubble: linear-gradient(135deg, #6366f1, #8b5cf6);
  --agent-bubble: #1c1f30;
  --shadow-card: 0 4px 20px rgba(0,0,0,0.25);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg-dark);
  color: var(--text-primary);
  height: 100vh;
  overflow: hidden;
}

.main-layout {
  display: flex;
  height: 100vh;
  width: 100vw;
}

.sidebar {
  width: 300px;
  background: var(--panel-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  z-index: 20;
}

.sidebar-top {
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.brand-name h2 { font-size: 14px; font-weight: 700; line-height: 1.3; }
.brand-name p { font-size: 10px; color: var(--text-muted); }

.sidebar-stats {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 6px;
  padding: 12px 20px; border-bottom: 1px solid var(--border);
}
.stat-item { text-align: center; padding: 6px 0; }
.stat-value { font-size: 15px; font-weight: 700; color: var(--primary-hover); }
.stat-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

.conv-section-title {
  font-size: 10px; color: var(--text-muted); text-transform: uppercase;
  letter-spacing: 1px; padding: 10px 20px 6px; font-weight: 600;
}

.conv-list { flex: 1; overflow-y: auto; padding: 2px 8px; }

.conv-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px; border-radius: 10px; cursor: pointer;
  transition: all 0.2s; margin-bottom: 2px;
}
.conv-item:hover { background: rgba(99,102,241,0.08); }
.conv-item.active { background: rgba(99,102,241,0.15); border: 1px solid rgba(99,102,241,0.25); }

.conv-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; flex-shrink: 0;
}

.conv-info { flex: 1; min-width: 0; }
.conv-name { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
.conv-preview { font-size: 10px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv-meta { text-align: right; flex-shrink: 0; }
.conv-time { font-size: 9px; color: var(--text-muted); }

.online-dot {
  width: 7px; height: 7px; background: var(--success);
  border-radius: 50%; display: block; margin: 3px auto 0;
  animation: pulse-dot 2s infinite;
}
@keyframes pulse-dot {
  0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,0.4)}
  50%{box-shadow:0 0 0 4px rgba(34,197,94,0)}
}

.sidebar-footer {
  padding: 12px 20px;
  border-top: 1px solid var(--border);
}

.stats-row {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 10px; color: var(--text-muted); margin-bottom: 8px;
}

.lang-toggle {
  display: flex; gap: 4px; flex-wrap: wrap;
}

.lang-btn {
  padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border);
  background: transparent; color: var(--text-secondary); font-size: 10px;
  cursor: pointer; transition: all 0.2s;
}
.lang-btn:hover { background: rgba(99,102,241,0.1); }
.lang-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

/* ===== MAIN CHAT AREA ===== */
.chat-area {
  flex: 1; display: flex; flex-direction: column;
  background: var(--bg-dark); z-index: 10; position: relative;
}

.chat-header {
  padding: 16px 24px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--panel-bg);
}

.chat-title h1 {
  font-size: 16px; font-weight: 600; margin-bottom: 2px;
}
.chat-title span {
  font-size: 11px; color: var(--text-muted);
}

.header-actions {
  display: flex; gap: 8px; align-items: center;
}

.live-badge {
  padding: 4px 10px; border-radius: 20px; font-size: 10px;
  font-weight: 600; display: flex; align-items: center; gap: 4px;
}

.badge-online {
  background: rgba(34,197,94,0.15); color: var(--success);
}

.badge-online::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--success);
}

.offline-badge {
  background: rgba(245,158,11,0.15); color: var(--warning);
}

.offline-badge::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--warning);
}

/* Messages container */
.messages-container {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1; overflow-y: auto; padding: 20px 24px;
  scroll-behavior: smooth;
}

.message-row {
  display: flex; gap: 10px; margin-bottom: 16px;
  max-width: 75%;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

/* Merchant-mode layout: customer messages on LEFT, AI responses on RIGHT */
.message-row.agent { 
  flex-direction: row-reverse;
  margin-right: 0;
  margin-left: auto;
  justify-content: flex-end;
}
.message-row.user { 
  flex-direction: row;
  margin-left: 0;
  margin-right: auto;
  justify-content: flex-start;
}

.msg-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--primary);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0; margin-top: 2px;
}
.msg-avatar.user-avatar { background: var(--accent); }

.msg-body {
  background: var(--agent-bubble);
  border-radius: 12px; padding: 12px 14px;
  border: 1px solid var(--border);
  max-width: 100%;
  word-break: break-word;
}

.message-row.user .msg-body {
  background: var(--user-bubble);
  border: none;
}

.msg-text { font-size: 13px; line-height: 1.6; color: var(--text-primary); }

.msg-footer {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 8px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.05);
  font-size: 10px; color: var(--text-muted);
}

.message-row.user .msg-footer { border-top-color: rgba(255,255,255,0.1); }

.msg-sender { font-weight: 500; }
.msg-time { opacity: 0.7; }
.msg-you { color: rgba(255,255,255,0.7); }

.feedback-bar {
  display: flex; gap: 6px; margin-top: 8px;
}

.fb-btn {
  padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border);
  background: transparent; color: var(--text-secondary); font-size: 11px;
  cursor: pointer; transition: all 0.2s; font-weight: 500;
}
.fb-btn.ok:hover { background: rgba(34,197,94,0.15); border-color: var(--success); }
.fb-btn.bad:hover { background: rgba(239,68,68,0.15); border-color: var(--danger); }

.typing-indicator span {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--text-muted); display: inline-block;
  animation: bounce 1.4s infinite both; margin: 0 1px;
}
.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}

.sys-msg {
  text-align: center; margin: 20px 0;
  font-size: 11px; color: var(--text-muted);
  position: relative;
}
.sys-msg::before, .sys-msg::after {
  content: ''; position: absolute; top: 50%;
  width: calc(50% - 100px); height: 1px;
  background: var(--border);
}
.sys-msg::before { left: 0; }
.sys-msg::after { right: 0; }

/* Input area */
.input-area {
  padding: 16px 24px; border-top: 1px solid var(--border);
  background: var(--panel-bg);
}

.quick-actions {
  display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap;
}

.action-btn {
  padding: 6px 12px; border-radius: 20px;
  border: 1px solid var(--border); background: var(--card-bg);
  color: var(--text-secondary); font-size: 11px; cursor: pointer;
  transition: all 0.2s; white-space: nowrap;
}
.action-btn:hover {
  border-color: var(--primary); color: var(--primary);
  background: rgba(99,102,241,0.1);
}
.num {
  display:inline-block; width:16px; height:16px; line-height:16px; border-radius:4px;
  background:var(--primary); color:#fff; font-size:10px; font-weight:700; text-align:center;
  margin-right:3px; vertical-align:middle;
}

.input-wrapper {
  display: flex; gap: 8px; align-items: stretch;
}

#msgInput {
  flex: 1; padding: 12px 16px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--input-bg);
  color: var(--text-primary); font-size: 13px;
  outline: none; transition: all 0.2s;
  resize: none; min-height: 44px; max-height: 120px;
  font-family: inherit;
}
#msgInput:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
#msgInput::placeholder { color: var(--text-muted); }

#sendBtn {
  padding: 0 20px; border-radius: 12px;
  background: var(--primary); color: white; border: none;
  font-weight: 600; cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
  min-width: 80px;
}
#sendBtn:hover { background: var(--primary-hover); }
#sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }

.transfer-btn {
  margin-top: 10px; padding: 8px 16px; border-radius: 10px;
  border: 1px dashed var(--text-muted); background: transparent;
  color: var(--text-muted); font-size: 11px; cursor: pointer;
  transition: all 0.2s;
  display: block; width: 100%; text-align: center;
}
.transfer-btn:hover {
  border-color: var(--primary); color: var(--primary);
  background: rgba(99,102,241,0.05);
}

/* Welcome screen */
.welcome-container {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; height: 100%; padding: 40px;
  text-align: center; background: radial-gradient(circle at center, rgba(99,102,241,0.05) 0%, transparent 60%);
}

.welcome-icon {
  width: 80px; height: 80px; border-radius: 24px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  display: flex; align-items: center; justify-content: center;
  font-size: 36px; margin-bottom: 24px;
  box-shadow: 0 8px 30px rgba(99,102,241,0.3);
}

.welcome-title {
  font-size: 24px; font-weight: 700; margin-bottom: 8px;
}

.welcome-subtitle {
  font-size: 14px; color: var(--text-muted); max-width: 400px; line-height: 1.6;
}

.feature-cards {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 12px; margin-top: 32px; width: 100%; max-width: 600px;
}

.feature-card {
  background: var(--panel-bg); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px; text-align: center;
  cursor: pointer; transition: all 0.2s;
}
.feature-card:hover { border-color: var(--primary); transform: translateY(-2px); }
.feature-card-icon { font-size: 24px; margin-bottom: 8px; }
.feature-card-title { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
.feature-card-desc { font-size: 10px; color: var(--text-muted); }

/* Demo mode indicator */
.demo-mode-banner {
  background: rgba(245,158,11,0.1);
  border: 1px solid rgba(245,158,11,0.2);
  border-radius: 8px; padding: 8px 16px;
  text-align: center; font-size: 12px; color: var(--warning);
  margin-bottom: 12px;
}

/* Scrollbar styling */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* RTL support */
[dir="rtl"] { direction: rtl; text-align: right; }
[dir="rtl"] .conv-meta { text-align: left; }
[dir="rtl"] .sidebar { border-right: none; border-left: 1px solid var(--border); }
[dir="rtl"] .chat-area .conv-list { padding: 2px 8px 2px 24px; }

@media (max-width: 768px) {
  .main-layout { flex-direction: column; }
  .sidebar { width: 100%; height: auto; max-height: 200px; }
  .feature-cards { grid-template-columns: repeat(2, 1fr); }
  .message-row { max-width: 90%; }
}
</style>
</head>
<body>

<div class="main-layout">

<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-top">
    <div class="brand">
      <div class="brand-icon">🤖</div>
      <div class="brand-name">
        <h2>CrossBot AI</h2>
        <p>跨境电商智能客服 Agent</p>
      </div>
    </div>
  </div>
  
  
  <div class="sidebar-stats">
    <div class="stat-item">
      <div class="stat-value">24/7</div>
      <div class="stat-label">可用性</div>
    </div>
    <div class="stat-item">
      <div class="stat-value">&lt;1s</div>
      <div class="stat-label">响应速度</div>
    </div>
    <div class="stat-item">
      <div class="stat-value">5</div>
      <div class="stat-label">语言</div>
    </div>
  </div>
  
  <!-- Simulated customer conversations -->
  <div class="conv-section-title" id="convTitle">客户对话</div>
  <div class="conv-list" id="convList"></div>
  
  <!-- Agent settings at bottom -->
  <div class="sidebar-footer">
    <div class="stats-row">
      <span id="agentStatusLabel">在线</span>
      <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--success);vertical-align:middle;margin-right:6px;" id="onlineDot"></span>
    </div>
    <div class="lang-toggle" id="langToggle"></div>
  </div>
</div>

<!-- Chat Area -->
<div class="chat-area">
  <div class="chat-header">
    <div class="chat-title">
      <h1 id="chatTitle">💬 对话窗口</h1>
      <span>TrendyWear 全球电商</span>
    </div>
    <div class="header-actions">
      <span id="apiStatusBadge" class="live-badge badge-online">实时连接</span>
    </div>
  </div>
  
  <div class="messages-container" id="messagesContainer">
    
  </div>
  
  <div class="input-area">
    <div class="quick-actions" id="shortcutActions"></div>
    
    <div class="input-wrapper">
      <textarea id="msgInput" placeholder="输入您的问题..." rows="1"></textarea>
      <button id="sendBtn" onclick="sendMessage()">发送</button>
    </div>
    
    <button class="transfer-btn" id="transferBtn" onclick="showTransferMsg()">🎧 转接人工客服</button>
  </div>
</div>


<script>
let currentLang = 'zh';

// ============================================
// LOCAL KEYWORD MATCHING ENGINE (offline mode)
// ============================================
function getLocalReply(message, lang) {
  const msg_lower = message.toLowerCase();
  const is_english = /[abcdefghijklmnopqrstuvwxyzeordertrackingreturnshipmentshippingdeliverypromotiondiscountsizing]/.test(msg_lower);
  
  // Scoring system
  const categories = {
    "物流查询": { weight: 10, cn: ["物流","快递","发货","到货","几天到","运单","包裹","tracking"], en: ["order","track","where is","shipping","delivery","package","transit"] },
    "退换货政策": { weight: 10, cn: ["退货","退款","换货","不满意","质量问题","exchange"], en: ["return","refund","exchange","cancel","defective","damaged"] },
    "尺码推荐": { weight: 8, cn: ["尺码","size","大号","小号","合身","偏大","偏小","身材","体重","身高"], en: ["size","fit","smaller","larger","tall","short","measure"] },
    "促销活动": { weight: 9, cn: ["优惠","打折","促销","折扣","满减"], en: ["discount","coupon","promo","sale","offer"] },
    "支付方式": { weight: 7, cn: ["支付","付款","分期","分期支付","分期付款","paypal","信用卡","支付宝","wechat","installment"], en: ["payment","pay","paypal","credit card","visa","mastercard"] },
    "配送时间": { weight: 9, cn: ["多久到","预计送达","运输时间","express","fast delivery","运费"], en: ["how long","when will","estimated delivery","shipping time"] },
    "产品咨询": { weight: 6, cn: ["这个多少钱","有什么颜色","材质","面料","product","material","color"], en: ["what color","how much","material","fabric","in stock"] },
    "发票与售后": { weight: 5, cn: ["发票","收据","保修","售后服务","warranty","receipt","invoice"], en: ["invoice","receipt","warranty","after-sales"] }
  };
  
  let best_match = null;
  let best_score = 0;
  
  for (const [cat_name, cat_info] of Object.entries(categories)) {
    let score = 0;
    for (const kw of cat_info.cn) {
      if (msg_lower.includes(kw)) score += cat_info.weight;
    }
    for (const kw of cat_info.en) {
      if (msg_lower.includes(kw)) score += Math.floor(cat_info.weight * 0.5);
    }
    if (score > best_score) {
      best_score = score;
      best_match = cat_name;
    }
  }
  
  if (!best_match) return null;
  
  // Templates with translations
  const templates = {
    "物流查询": {
      zh: "您好！您的订单正在全力运输中 📦\n\n我们可以帮您做以下几件事：\n1️⃣ 输入运单号，实时追踪包裹位置\n2️⃣ 查看预计送达日期\n3️⃣ 如有异常主动联系您\n\n请问需要哪一项服务？",
      en: "Your order is on its way! 📦\n\nI can help you with:\n1️⃣ Track your package by tracking number\n2️⃣ Check estimated delivery date\n3️⃣ Alert you if there are any delays\n\nWhat would you like to do?",
      de: "Ihre Bestellung ist auf dem Weg! 📦\n\nIch kann Ihnen helfen bei:\n1️⃣ Paketverfolgung mit Sendungsnummer\n2️⃣ Geschätzte Lieferdatum prüfen\n3️⃣ Benachrichtigung bei Verzögerungen\n\nWas möchten Sie tun?",
      ja: "ご注文は配送中です！📦\n\nお手伝いできます：\n1️⃣ 出荷番号で追跡\n2️⃣ 配達予定日を確認\n3️⃣ 遅延のアラート\n\nご希望のサービスは？",
      ar: "طلبك في طريقه! 📦\n\nيمكنني مساعدتك في:\n1️⃣ تتبع الطرد برمز الشحن\n2️⃣ التحقق من تاريخ التسليم المتوقع\n3️⃣ التنبيه عند التأخير\n\nماذا تريد أن تفعل؟"
    },
    "退换货政策": {
      zh: "🔄 **退换货无忧保障**\n\n✅ 30天无理由退货（不影响二次销售的商品）\n✅ 质量问题我们承担往返运费\n✅ 换货免邮费，优先处理\n\n退货流程：\n1. 在「我的订单」页面申请\n2. 寄回至最近海外仓\n3. 收到后5个工作日内原路退款\n\n请问您需要退货还是换货？",
      en: "🔄 **Hassle-Free Returns**\n\n✅ 30-day no-questions return policy\n✅ Free return shipping for quality issues\n✅ Priority processing for exchanges\n\nHow to return:\n1. Apply from Your Orders page\n2. Ship to nearest warehouse\n3. Refund within 5 business days after receiving\n\nWould you like to return or exchange?",

function renderAllDynamicContent(lang) {
  const t = UI_TEXTS[lang] || UI_TEXTS.zh;
  
  // Sidebar: conversation list title
  const ct = document.getElementById('convTitle');
  if (ct) ct.textContent = t.quickStart === '快速开始' ? '客户对话' : 'Customer Conversations';
  
  // Sidebar: simulated customer conversations
  const cl = document.getElementById('convList');
  if (cl) {
    cl.innerHTML = '';
    var timeUnits = ['刚刚','3分钟前','12分钟前','28分钟前'];
    var times = ['12:30','12:27','12:18','12:02'];
    
    var customers = [];
    for (var i = 0; i < 4; i++) {
      customers.push({
        name: ["Emma Wilson","Sophie Laurent","Hans Mueller","Yuki Tanaka"][i],
        preview: t.sidebarItems[i].preview + ' · ' + timeUnits[i],
        time: times[i],
        avatar: t.sidebarItems[i].avatar || t.sidebarItems[i].action.charAt(0),
        active: i === 0,
        color: t.sidebarItems[i].color,
        action: t.sidebarItems[i].action,
        tag: t.sidebarItems[i].tag
      });
    }
    customers.forEach(function(cust) {
      var el = document.createElement('div');
      el.className = 'conv-item' + (cust.active ? ' active' : '');
      el.onclick = function() { 
        // Switch this conversation entry to active
        var items = document.querySelectorAll('#convList .conv-item');
        for (var k = 0; k < items.length; k++) items[k].className = 'conv-item';
        el.className = 'conv-item active';
        
        // Show greeting from that customer perspective
        addSysMessage('切换到客户对话 - ' + cust.name);
        addAgentReply('您好！我是 Luna，您的专属购物助手。请问有什么可以帮您的吗？😊', {});
      };
      el.innerHTML = '<div class="conv-avatar" style="background:' + cust.color + '">' + cust.avatar + '</div><div class="conv-info"><div class="conv-name">' + cust.name + '</div><div class="conv-preview">' + cust.preview + '</div></div><div class="conv-meta"><div class="conv-time">' + cust.time + '</div></div>';
      cl.appendChild(el);
    });
  }
  
  // Language toggle buttons
  const lt = document.getElementById('langToggle');
  if (lt) {
    lt.innerHTML = '';
    ['zh','en','de','ja','ar'].forEach(function(l) {
      var btn = document.createElement('button');
      btn.className = 'lang-btn' + (l === lang ? ' active' : '');
      var labels = {zh:'中文',en:'EN',de:'DE',ja:'JA',ar:'AR'};
      btn.textContent = labels[l];
      btn.onclick = function() { setLang(this, l); };
      lt.appendChild(btn);
    });
  }
  
  // Input area elements
  const si = document.getElementById('msgInput');
  if (si) si.placeholder = t.inputPlaceholder;
  
  const sb = document.getElementById('sendBtn');
  if (sb) sb.textContent = t.sendBtn;
  
  const tb = document.getElementById('transferBtn');
  if (tb) tb.textContent = t.transferBtn;
  
// Numbered shortcut actions below input
  const sa = document.getElementById('shortcutActions');
if (sa) {
    sa.innerHTML = '';
    t.shortcuts.forEach(function(s, i) {
var btn = document.createElement('button');
      btn.className = 'action-btn';
      btn.onclick = function() { sendAction(s.action); };
      btn.innerHTML = '<span class="num">' + (i+1) + '</span> ' + s.label;
      sa.appendChild(btn);
    });
}
}

function showTransferMsg() {
  const t = UI_TEXTS[currentLang] || UI_TEXTS.zh;
  alert(t.transferMsg);
}

function getTime() {
  return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
}

function scrollToBottom() {
  const c = document.getElementById('messagesContainer');
  setTimeout(() => c.scrollTo({ top: c.scrollHeight, behavior: 'smooth' }), 80);
}

function addSysMessage(text) {
  const div = document.createElement('div');
  div.className = 'sys-msg';
  div.textContent = text;
  document.getElementById('messagesContainer').appendChild(div);
  scrollToBottom();
}

function addAgentReply(content, extra) {
  if (!extra) extra = {};
  const container = document.getElementById('messagesContainer');
  const group = document.createElement('div');
  group.className = 'message-row agent';
  
  let processed = content
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
  
  const isRTL = currentLang === 'ar' || /[\u0600-\u06FF]/.test(content);
  group.style.direction = isRTL ? 'rtl' : 'ltr';
  if (isRTL) { group.style.textAlign = 'right'; }
  
  var btnLabels = {
    zh: {ok:'👍 有帮助', bad:'👎 无帮助', marked_ok:'已标记 👍', marked_bad:'已标记 👎'},
    en: {ok:'👍 Helpful', bad:'👎 Unhelpful', marked_ok:'Marked 👍', marked_bad:'Marked 👎'},
    de: {ok:'👍 Hilfreich', bad:'👎 Nicht hilfreich', marked_ok:'Markiert 👍', marked_bad:'Markiert 👎'},
    ja: {ok:'👍 役に立った', bad:'👎 役に立たなかった', marked_ok:'マーク済み 👍', marked_bad:'マーク済み 👎'},
    ar: {ok:'👍 مفيد', bad:'👎 غير مفيد', marked_ok:'تم التحديد 👍', marked_bad:'تم التحديد 👎'}
  };
  var labels = btnLabels[currentLang] || btnLabels.zh;
  
  group.innerHTML = '<div class="msg-avatar">🤖</div><div class="msg-body"><div class="msg-text">' + processed + '</div><div class="feedback-bar"><button class="fb-btn ok" onclick="this.style.background=\'rgba(34,197,94,.15)\';this.style.borderColor=\'#22c55e\';this.textContent=\'' + labels.marked_ok + '\'">👍 ' + labels.ok + '</button><button class="fb-btn bad" onclick="this.style.background=\'rgba(239,68,68,.15)\';this.style.borderColor=\'#ef4444\';this.textContent=\'' + labels.marked_bad + '\'">👎 ' + labels.bad + '</button></div><div class="msg-footer"><span class="msg-sender msg-agent">Luna (AI)</span><span class="msg-time">' + getTime() + (extra.time ? ' · ⏱ '+extra.time+'s' : '') + '</span></div></div>';
  
  container.appendChild(group);
  scrollToBottom();
}

function addUserMessage(text) {
  const container = document.getElementById('messagesContainer');
  const group = document.createElement('div');
  group.className = 'message-row user';
  
  const isRTL = currentLang === 'ar' || /[\u0600-\u06FF]/.test(text);
  group.style.direction = isRTL ? 'rtl' : 'ltr';
  
  group.innerHTML = '<div class="msg-avatar">李</div><div class="msg-body"><div class="msg-text">' + text.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div><div class="msg-footer"><span class="msg-time msg-you">' + getTime() + '</span></div></div>';
  
  container.appendChild(group);
  scrollToBottom();
}

async function showTypingThenReply(actionText) {
  addUserMessage(actionText);
  isTyping = true;
  document.getElementById('sendBtn').disabled = true;
  
  const container = document.getElementById('messagesContainer');
  const typingRow = document.createElement('div');
  typingRow.className = 'message-row agent';
  typingRow.id = 'typingRow';
  typingRow.innerHTML = '<div class="msg-avatar">🤖</div><div class="msg-body"><div class="msg-text"><div class="typing-indicator"><span></span><span></span><span></span></div></div></div>';
  container.appendChild(typingRow);
  scrollToBottom();
  
  try {
    const resp = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: actionText, lang: currentLang })
    });
    
    if (resp.status === 200) {
      const data = await resp.json();
      removeTyping();
      const replyTime = data.response_time_ms || 0;
      addAgentReply(data.reply, { time: (replyTime / 1000).toFixed(1) });
    } else {
      throw new Error("Non-200");
    }
  } catch (err) {
    console.log("API not available, using local demo mode...");
    const reply = getLocalReply(actionText, currentLang);
    if (reply) {
      removeTyping();
      addAgentReply(reply, { time: "0.5" });
    } else {
      const fallbacks = {
        zh: "感谢您的咨询！😊\n\n我是 Luna，您的专属购物助手。\n\n我可以帮助您：\n• 📦 查询订单物流\n• 🔄 退换货处理\n• 👗 尺码推荐\n• 🎉 最新促销活动\n\n请问有什么可以帮您的呢？",
        en: "Thank you for your message! 😊\n\nI am Luna, your virtual shopping assistant.\n\nI can help you with:\n• 📦 Tracking your order\n• 🔄 Returns & exchanges\n• 👕 Size recommendations\n• 🎉 Current promotions\n\nCould you be more specific? I am here to help!",
        de: "Vielen Dank für Ihre Nachricht! 😊\n\nIch bin Luna, Ihr virtueller Einkaufsassistent.\n\nIch kann Ihnen helfen bei:\n• 📦 Sendungsverfolgung\n• 🔄 Rückgabe & Umtausch\n• 👕 Größempfehlungen\n• 🎉 Aktuelle Angebote\n\nKönnen Sie genauer sein? Ich helfe gerne!",
        ja: "お問い合わせありがとうございます！😊\n\nLuna、TrendyWearの仮想アシスタントです。\n\nお手伝いできます：\n• 📦 配送追跡\n• 🔄 返品・交換\n• 👕 サイズ推薦\n• 🎉 最新のプロモーション\n\nもう少し詳しくお知らせください！",
        ar: "شكراً لاستفسارك! 😊\n\nأنا لونا، مساعد التسوق الافتراضي.\n\nيمكنني مساعدتك في:\n• 📦 تتبع الطلب\n• 🔄 الإرجاع والتبادل\n• 👕 توصيات المقاسات\n• 🎉 العروض الحالية\n\nهل يمكنك أن تكون أكثر تحديداً؟ أنا هنا للمساعدة!"
      };
      removeTyping();
      addAgentReply(fallbacks[currentLang] || fallbacks.zh, { time: "0.5" });
    }
  } finally {
    isTyping = false;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('msgInput').focus();
  }
}

function removeTyping() {
  const el = document.getElementById('typingRow');
  if (el) el.remove();
}

function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  showTypingThenReply(text);
}

function sendAction(text) {
  showTypingThenReply(text);
}
